name: CI

# Both jobs check the freshly built docs/ rather than the live site on purpose:
# this repo (iintothewind/swan-post) is the generator source, and pushing here does
# not publish anything. GitHub Pages is updated by a manual `npm run deploy` into
# iintothewind/iintothewind.github.io. A live check would fail on every push that
# adds a post, since its URLs 404 until someone deploys.
# To check production manually after a deploy: run `node scripts/check-links.js`
# with no argument (baseUrl then defaults to blog.config.json's siteUrl).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-parity:
    name: Three-index parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node scripts/cli.js build
      - run: node scripts/check-index-parity.js

  check-links:
    name: Link self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node scripts/cli.js build
      - name: Start preview server
        run: |
          node scripts/cli.js serve -p 8123 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/; then
              echo "preview server ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview server failed to start" >&2
          exit 1
      - name: Check every indexed URL
        run: node scripts/check-links.js http://127.0.0.1:8123
      - name: Stop preview server
        if: always()
        run: pkill -f "cli.js serve" || true
